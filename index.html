<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Distance Between Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-deep:#3a1330;
    --plum-mid:#5c1f42;
    --rose-mid:#a63862;
    --blush:#ffd6e3;
    --hot-pink:#ff5f8f;
    --coral-gold:#ffb37b;
    --cream:#fff2ee;
    --text-soft:#f3d9e4;
    --line-idle:rgba(255,214,227,0.22);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 55% at 50% -8%, #b84a72 0%, transparent 62%),
      linear-gradient(180deg, var(--plum-deep) 0%, var(--plum-mid) 50%, var(--rose-mid) 100%);
    font-family:'Inter', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
  }

  .hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:920px;
    margin:0 auto;
    padding:56px 24px 72px;
  }

  header{
    text-align:center;
    margin-bottom:8px;
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--coral-gold);
    margin:0 0 10px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(30px, 5vw, 48px);
    line-height:1.18;
    margin:0 0 8px;
    color:var(--cream);
  }

  .sub{
    color:var(--text-soft);
    font-size:15px;
    margin:0;
    opacity:0.85;
  }

  /* countdown block */
  .count-row{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:14px;
    margin:44px 0 6px;
  }

  .count-num{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(64px, 14vw, 128px);
    line-height:1;
    background:linear-gradient(180deg, var(--cream) 0%, var(--blush) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em;
  }

  .count-label{
    font-size:16px;
    color:var(--coral-gold);
    padding-bottom:14px;
  }

  .count-sub{
    text-align:center;
    color:var(--text-soft);
    font-size:14px;
    margin-bottom:48px;
    opacity:0.9;
  }

  .count-sub strong{
    color:var(--coral-gold);
    font-weight:600;
  }

  .clock-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:2px 0 18px;
  }

  .clock-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:52px;
  }

  .clock-num{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    color:var(--blush);
    font-variant-numeric:tabular-nums;
    line-height:1.1;
  }

  .clock-label{
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-soft);
    opacity:0.6;
    margin-top:2px;
  }

  .clock-colon{
    font-family:'Fraunces', serif;
    font-size:22px;
    color:var(--hot-pink);
    opacity:0.7;
    padding-bottom:14px;
  }

  /* road / journey visualization */
  .journey{
    position:relative;
    margin:0 auto 28px;
    max-width:860px;
  }

  svg.road{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }

  .road-path{
    fill:none;
    stroke:var(--line-idle);
    stroke-width:2;
    stroke-dasharray:2 11;
    stroke-linecap:round;
  }

  .road-path-fill{
    fill:none;
    stroke:url(#travelGrad);
    stroke-width:2.5;
    stroke-linecap:round;
    transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
  }

  .meet-heart{
    fill:var(--coral-gold);
    opacity:0.75;
    transform-origin:430px 79px;
    animation:pulseHeart 1.8s ease-in-out infinite;
  }

  @keyframes pulseHeart{
    0%,100%{ transform:scale(1); opacity:0.6; }
    50%{ transform:scale(1.18); opacity:0.9; }
  }

  .meet-label{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:12px;
    fill:var(--coral-gold);
    opacity:0.85;
  }

  /* photo frames */
  .photo-frame{
    cursor:pointer;
  }

  .frame-ring{
    fill:none;
    stroke:var(--hot-pink);
    stroke-width:2.5;
  }

  .frame-ring.right{
    stroke:var(--coral-gold);
  }

  .photo-fallback{
    fill:var(--plum-mid);
  }

  .photo-icon{
    fill:none;
    stroke:var(--text-soft);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .frame-name{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    fill:var(--cream);
    text-anchor:middle;
  }

  .frame-hint{
    font-family:'Inter', sans-serif;
    font-size:10px;
    fill:var(--text-soft);
    text-anchor:middle;
    opacity:0.65;
  }

  /* traveling marker: a small figure walking toward her */
  .traveler{
    filter:drop-shadow(0 0 7px rgba(255,179,123,0.85));
  }

  .walker{
    animation: walkBob 0.6s ease-in-out infinite;
  }

  @keyframes walkBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-2.4px); }
  }

  .walker-part{
    stroke:var(--cream);
    stroke-width:2;
    stroke-linecap:round;
    fill:none;
  }

  .walker-head{
    fill:var(--cream);
    stroke:none;
  }

  .walker-leg-front{
    transform-origin:0px 2px;
    animation: legFront 0.6s ease-in-out infinite;
  }
  .walker-leg-back{
    transform-origin:0px 2px;
    animation: legBack 0.6s ease-in-out infinite;
  }
  @keyframes legFront{
    0%,100%{ transform:rotate(24deg); }
    50%{ transform:rotate(-24deg); }
  }
  @keyframes legBack{
    0%,100%{ transform:rotate(-24deg); }
    50%{ transform:rotate(24deg); }
  }

  .walker-arm-front{
    transform-origin:0px -9px;
    animation: armFront 0.6s ease-in-out infinite;
  }
  .walker-arm-back{
    transform-origin:0px -9px;
    animation: armBack 0.6s ease-in-out infinite;
  }
  @keyframes armFront{
    0%,100%{ transform:rotate(-18deg); }
    50%{ transform:rotate(18deg); }
  }
  @keyframes armBack{
    0%,100%{ transform:rotate(18deg); }
    50%{ transform:rotate(-18deg); }
  }

  /* controls */
  .controls{
    max-width:420px;
    margin:44px auto 0;
    padding:20px 22px;
    background:rgba(255,214,227,0.06);
    border:1px solid rgba(255,214,227,0.16);
    border-radius:14px;
  }

  .controls-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }

  .controls-row + .controls-row{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid rgba(255,214,227,0.12);
  }

  .controls label{
    font-size:13px;
    color:var(--text-soft);
  }

  .controls input[type="date"]{
    background:rgba(255,214,227,0.08);
    border:1px solid rgba(255,214,227,0.24);
    color:var(--cream);
    border-radius:8px;
    padding:7px 10px;
    font-family:'Inter', sans-serif;
    font-size:13px;
  }

  .controls input[type="date"]::-webkit-calendar-picker-indicator{
    filter:invert(0.9) sepia(0.3) saturate(2) hue-rotate(300deg);
  }

  .reset-link{
    background:none;
    border:none;
    color:var(--hot-pink);
    font-size:13px;
    cursor:pointer;
    padding:0;
    font-family:'Inter', sans-serif;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  input[type="file"]{
    display:none;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:rgba(243,217,228,0.55);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* Fixed full-screen container behind content */
  .bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover; /* Ensures video scales without stretching */
    z-index: -1;       /* Sends video behind text/elements */
  }

  /* Example content layered on top */
  .content {
    position: relative;
    color: white;
    text-align: center;
    padding-top: 20%;
    font-family: sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    .road-path-fill{ transition:none; }
    .meet-heart{ animation:none; }
    .walker, .walker-leg-front, .walker-leg-back, .walker-arm-front, .walker-arm-back{ animation:none; }
  }

  @media (max-width:600px){
    .journey{ padding:0 6px; }
  }
</style>
</head>
<body>
<!-- Background Video Element -->
<video class="bg-video" autoplay loop playsinline>
  <source src="videoplayback.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

<canvas class="hearts" id="heartsCanvas"></canvas>

<div class="wrap">
  <header>
    <p class="eyebrow">365 days apart, one heart</p>
    <h1>The gap gets smaller<br>every single day.</h1>
    <p class="sub">Take all the time you need. I'll be waiting patiently until you're ready to answer.</p>
  </header>

  <div class="count-row">
    <span class="count-num" id="daysLeft">365</span>
    <span class="count-label">days left</span>
  </div>

  <div class="clock-row" aria-label="time remaining">
    <div class="clock-unit"><span class="clock-num" id="clockH">00</span><span class="clock-label">hrs</span></div>
    <span class="clock-colon">:</span>
    <div class="clock-unit"><span class="clock-num" id="clockM">00</span><span class="clock-label">min</span></div>
    <span class="clock-colon">:</span>
    <div class="clock-unit"><span class="clock-num" id="clockS">00</span><span class="clock-label">sec</span></div>
  </div>

  <p class="count-sub"><strong id="pctClosed">0%</strong> closer already · meeting on <strong id="meetDateLabel">—</strong></p>

  <div class="journey">
    <svg class="road" viewBox="0 0 860 260" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="travelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff5f8f"/>
          <stop offset="100%" stop-color="#ffb37b"/>
        </linearGradient>
        <clipPath id="clipA"><circle cx="90" cy="150" r="52"/></clipPath>
        <clipPath id="clipB"><circle cx="770" cy="150" r="52"/></clipPath>
      </defs>

      <!-- idle full road -->
      <path id="roadFull" class="road-path" d="M 90 150 Q 430 40 770 150"/>
      <!-- traveled portion, animated via stroke-dashoffset -->
      <path id="roadFill" class="road-path-fill" d="M 90 150 Q 430 40 770 150"/>

      <!-- meeting point marker: a small pulsing heart -->
      <g class="meet-point">
        <path class="meet-heart" d="M 430 82 C 424 74, 412 74, 412 84 C 412 92, 430 104, 430 104 C 430 104, 448 92, 448 84 C 448 74, 436 74, 430 82 Z"/>
        <text class="meet-label" x="430" y="122" text-anchor="middle">meeting point</text>
      </g>

      <!-- traveler marker: the man, walking toward her world -->
      <g id="travelerDot" class="traveler">
        <g class="walker">
          <circle class="walker-head" cx="0" cy="-14" r="3.2"/>
          <line class="walker-part walker-body" x1="0" y1="-11" x2="0" y2="2"/>
          <line class="walker-part walker-arm walker-arm-back" x1="0" y1="-9" x2="-4" y2="-2"/>
          <line class="walker-part walker-arm walker-arm-front" x1="0" y1="-9" x2="4" y2="-2"/>
          <line class="walker-part walker-leg walker-leg-back" x1="0" y1="2" x2="-4" y2="9"/>
          <line class="walker-part walker-leg walker-leg-front" x1="0" y1="2" x2="4" y2="9"/>
        </g>
      </g>

      <!-- photo A (left / you) -->
      <g id="frameA" data-slot="A">
        <circle class="frame-ring" cx="90" cy="150" r="54"/>
        <g clip-path="url(#clipA)">
          <circle class="photo-fallback" cx="90" cy="150" r="52"/>
          <image id="imgA" x="38" y="98" width="104" height="104" preserveAspectRatio="xMidYMid slice" style="display:none"/>
          <g id="iconA">
            <circle class="photo-icon" cx="90" cy="140" r="16"/>
            <path class="photo-icon" d="M 58 190 Q 90 158 122 190"/>
          </g>
        </g>
        <!-- <text class="frame-name" x="90" y="222">You</text> -->
      </g>

      <!-- photo B (right / her) -->
      <g id="frameB" data-slot="B">
        <circle class="frame-ring right" cx="770" cy="150" r="54"/>
        <g clip-path="url(#clipB)">
          <circle class="photo-fallback" cx="770" cy="150" r="52"/>
          <image id="imgB" x="718" y="98" width="104" height="104" preserveAspectRatio="xMidYMid slice" style="display:none"/>
          <g id="iconB">
            <circle class="photo-icon" cx="770" cy="140" r="16"/>
            <path class="photo-icon" d="M 738 190 Q 770 158 802 190"/>
          </g>
        </g>
        <!-- <text class="frame-name" x="770" y="222">Her</text> -->
      </g>
    </svg>
  </div>

  <footer>Waiting since 17 August 2026 — 365 days, for you.</footer>
</div>

<script>
(function(){
  // ---------- floating hearts background ----------
  const canvas = document.getElementById('heartsCanvas');
  const ctx = canvas.getContext('2d');
  function sizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = document.body.scrollHeight;
  }
  sizeCanvas();

  function makeHeart(){
    return {
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      s: Math.random()*24 + 14,
      baseA: Math.random()*0.22 + 0.08,
      phase: Math.random()*Math.PI*2,
      pulseSpeed: Math.random()*0.015 + 0.006,
      hue: Math.random() > 0.5 ? '255,95,143' : '255,179,123'
    };
  }
  const hearts = Array.from({length: 30}, makeHeart);

  function drawHeart(x, y, s, alpha, rgb){
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(-s*0.5, -s*0.3, -s, s*0.15, 0, s);
    ctx.bezierCurveTo(s, s*0.15, s*0.5, -s*0.3, 0, s*0.3);
    ctx.closePath();
    ctx.fillStyle = `rgba(${rgb},${alpha})`;
    ctx.fill();
    ctx.restore();
  }

  function heartsTick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const h of hearts){
      h.phase += h.pulseSpeed;
      const alpha = h.baseA + Math.sin(h.phase) * (h.baseA * 0.6);
      drawHeart(h.x, h.y, h.s, Math.max(0.03, alpha), h.hue);
    }
    requestAnimationFrame(heartsTick);
  }
  heartsTick();
  window.addEventListener('resize', () => {
    sizeCanvas();
    for(const h of hearts){
      h.x = Math.random()*canvas.width;
      h.y = Math.random()*canvas.height;
    }
  });

  // ---------- date logic ----------
  const msDay = 86400000;
  const today = new Date();
  today.setHours(0,0,0,0);

  // the day she gave him the 365-day wait
  const startDate = new Date('2026-08-17T22:23:00');
  const spanDays = 365;
  const meetDate = new Date(startDate.getTime() + spanDays*msDay);

  const daysLeftEl = document.getElementById('daysLeft');
  const pctEl = document.getElementById('pctClosed');
  const meetLabelEl = document.getElementById('meetDateLabel');
  const clockH = document.getElementById('clockH');
  const clockM = document.getElementById('clockM');
  const clockS = document.getElementById('clockS');

  const roadFill = document.getElementById('roadFill');
  const roadLen = roadFill.getTotalLength();
  roadFill.style.strokeDasharray = roadLen;
  roadFill.style.strokeDashoffset = roadLen;

  const travelerDot = document.getElementById('travelerDot');
  const frameA = document.getElementById('frameA');
  const frameB = document.getElementById('frameB');

  function fmtDisplay(d){
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function pad(n){
    return String(n).padStart(2, '0');
  }

  const totalMs = spanDays * msDay;

  function tick(){
    const now = new Date();
    let remainingMs = meetDate.getTime() - now.getTime();
    if (remainingMs < 0) remainingMs = 0;

    const elapsedMs = Math.min(totalMs, Math.max(0, totalMs - remainingMs));
    const progress = totalMs > 0 ? elapsedMs / totalMs : 1;

    const days = Math.floor(remainingMs / msDay);
    const hours = Math.floor((remainingMs % msDay) / 3600000);
    const minutes = Math.floor((remainingMs % 3600000) / 60000);
    const seconds = Math.floor((remainingMs % 60000) / 1000);

    daysLeftEl.textContent = days;
    clockH.textContent = pad(hours);
    clockM.textContent = pad(minutes);
    clockS.textContent = pad(seconds);
    pctEl.textContent = Math.round(progress*100) + '%';
    meetLabelEl.textContent = fmtDisplay(meetDate);

    const offset = roadLen * (1 - progress);
    roadFill.style.strokeDashoffset = offset;

    const pt = roadFill.getPointAtLength(roadLen * progress);
    travelerDot.setAttribute('transform', `translate(${pt.x}, ${pt.y})`);

    const shift = 46 * progress;
    frameA.setAttribute('transform', `translate(${shift}, 0)`);
    frameB.setAttribute('transform', `translate(${-shift}, 0)`);
  }

  // ---------- static photos ----------
  // Replace these two filenames with the real photos (same folder as this file),
  // or ask Claude to embed them directly and this will be swapped for real image data.
  function setStaticPhoto(imgId, iconId, src){
    const img = document.getElementById(imgId);
    const icon = document.getElementById(iconId);
    img.addEventListener('error', () => {
      img.style.display = 'none';
      icon.style.display = 'block';
    });
    img.setAttribute('href', src);
    img.style.display = 'block';
    icon.style.display = 'none';
  }
  setStaticPhoto('imgA', 'iconA', 'me.jpg');
  setStaticPhoto('imgB', 'iconB', 'oun.jpg');

  requestAnimationFrame(() => {
    tick();
    setInterval(tick, 1000);
  });
})();
</script>

</body>
</html>
